name: Publish to npm

# 發布靠 npm Trusted Publishing（OIDC）：不需要任何長期 token，
# 由 npm 端記錄「這個 repo 的這支 workflow 才能發佈 dsh-tps」。
# 打 v* tag 就會發佈；也可以在 Actions 頁面手動 workflow_dispatch。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  id-token: write   # 取得 OIDC token 給 npm（Trusted Publishing 必要）
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Toolchain
        run: node --version && npm --version

      # 純 Node、零依賴，不需要 npm ci / 建置；直接跑測試。
      - name: Test
        run: npm test

      - name: Publish (trusted publishing; provenance 自動附加)
        run: npm publish --access public
