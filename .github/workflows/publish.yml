name: publish

# 推 v* tag 时自动发布到 npm（需要 npmjs.com 上的 Trusted Publisher 配置），
# 也可在 Actions 页面手动触发。凭证走 OIDC，仓库里没有任何 npm token。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Show versions
        run: node --version && npm --version

      - name: Publish (OIDC trusted publishing, no NODE_AUTH_TOKEN)
        run: npm publish --provenance --access public --loglevel=notice
